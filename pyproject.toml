[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "warpline"
version = "0.1.0"
description = "A kernel's timeline, read out of stamps: a name and a clock value on a warp's lane."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[tool.setuptools.packages.find]
include = ["warpline*"]
